# Local development stack. Security is off because this cluster only ever listens on localhost.
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.5
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      # Native RRF needs a trial or Enterprise licence; the app falls back to client-side RRF otherwise.
      - xpack.license.self_generated.type=trial
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      retries: 12

  # Optional: docker compose --profile kibana up
  kibana:
    image: docker.elastic.co/kibana/kibana:9.5.5
    profiles: ["kibana"]
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "127.0.0.1:5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

volumes:
  es-data:
